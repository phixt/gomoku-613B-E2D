<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gomoku-613B-E2D</title>
    <link rel="stylesheet" href="/src/style/main.css" />
</head>
<body>
    <!-- 开始界面覆盖层 -->
    <div id="start-screen">
        <div class="start-content">
            <h1>GOMOKU 613B-E2D</h1>
            <p class="subtitle">Discrete 3D Tactical Gomoku</p>
            
            <div class="controls-section">
                <h3>3D 空间与视角</h3>
                <div class="controls-grid">
                    <div class="key-combo"><kbd>Q</kbd> / <kbd>E</kbd></div>
                    <span>旋转 3D 视角（绕 Y 轴）</span>
                    
                    <div class="key-combo"><kbd>W</kbd> / <kbd>S</kbd></div>
                    <span>推拉 3D 视角（缩放）</span>
                    
                    <div class="key-combo"><kbd>Z</kbd> / <kbd>C</kbd></div>
                    <span>调整层间距（压缩 / 拉大）</span>
                </div>
            </div>
            
            <div class="controls-section">
                <h3>层级与平面</h3>
                <div class="controls-grid">
                    <div class="key-combo"><kbd>A</kbd> / <kbd>D</kbd></div>
                    <span>切换层级（循环 0-5）</span>
                    
                    <div class="key-combo"><kbd>F</kbd></div>
                    <span>翻转 2D 主战场（水平镜像）</span>
                </div>
            </div>

            <div class="controls-section">
                <h3>显示与对弈</h3>
                <div class="controls-grid">
                    <div class="key-combo"><kbd>T</kbd></div>
                    <span>切换 亮色 / 暗色 主题</span>
                    
                    <div class="key-combo"><kbd>H</kbd></div>
                    <span>开启 / 关闭 战术辅助线</span>
                    
                    <div class="key-combo"><span>鼠标悬停</span></div>
                    <span>查看 2D/3D 战术线 & 蓝色定位点</span>
                    
                    <div class="key-combo"><span>鼠标点击</span></div>
                    <span>在当前焦点层落子</span>
                </div>
            </div>
            
            <button id="start-btn">START GAME</button>
        </div>
    </div>

    <div id="app">
        <div id="left-panel" class="panel"></div>
        <div id="right-panel" class="panel"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
